<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>F1 Manager — Quartier Général</title>
<link rel="stylesheet" href="css/immersive-theme.css?v=20260709"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
.qg-hero {
  background: linear-gradient(135deg, #0e0005 0%, #07070d 100%);
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  position: relative; overflow: hidden;
}
.qg-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(232,0,61,.04), transparent);
  animation: shimmer 4s ease-in-out infinite;
}
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

.qg-eyebrow { font-family: var(--fh); font-size: 9px; font-weight: 900; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
.qg-title   { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; }
.qg-sub     { font-family: var(--fh); font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; }

/* Bonus actifs */
.bonus-bar {
  margin: 10px 16px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 10px;
  padding: 10px 12px;
}
.bonus-bar-title { font-family: var(--fh); font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.bonus-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bonus-chip {
  font-family: var(--fh); font-size: 10px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
  background: rgba(0,217,126,.10); border: 1px solid rgba(0,217,126,.22); color: var(--green);
  display: flex; align-items: center; gap: 4px;
}
.bonus-chip.none { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.07); color: var(--muted); }

/* Section */
.sec-lbl {
  font-family: var(--fh); font-size: 9px; font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  padding: 14px 16px 6px;
  display: flex; align-items: center; gap: 8px;
}
.sec-lbl::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.07); }

/* Grid bâtiments */
.bld-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }

/* Card bâtiment */
.bld-card {
  background: var(--surface);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 14px 12px;
  position: relative; overflow: hidden;
  transition: border-color .2s;
}
.bld-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--bcolor);
  border-radius: 14px 14px 0 0;
}
.bld-card.upgrading { border-color: rgba(245,200,66,.30); }
.bld-card.maxed     { border-color: rgba(0,217,126,.25); }

.bld-icon  { font-size: 24px; line-height: 1; margin-bottom: 6px; }
.bld-name  { font-family: var(--fh); font-size: 14px; font-weight: 900; letter-spacing: .5px; margin-bottom: 2px; }
.bld-level { font-family: var(--fh); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.bld-level span { color: var(--gold); }

/* Étoiles niveau */
.stars { display: flex; gap: 3px; margin-bottom: 8px; }
.star  { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.10); }
.star.on { background: var(--bcolor); box-shadow: 0 0 5px var(--bcolor); }

/* Bonus actuel */
.bld-bonus {
  font-family: var(--fh); font-size: 10px; color: var(--green);
  background: rgba(0,217,126,.08); border: 1px solid rgba(0,217,126,.16);
  border-radius: 6px; padding: 3px 8px; margin-bottom: 8px;
  min-height: 22px; display: flex; align-items: center;
}
.bld-bonus.empty { color: var(--muted); background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.06); }

/* Prochain bonus */
.bld-next {
  font-family: var(--fh); font-size: 9px; color: rgba(255,255,255,.35);
  margin-bottom: 10px; line-height: 1.4;
}
.bld-next strong { color: rgba(255,255,255,.6); }

/* Barre progression amélioration */
.prog-wrap-bld { margin-bottom: 8px; }
.prog-lbl { font-family: var(--fh); font-size: 9px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 3px; }
.prog-track-bld { height: 4px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; }
.prog-fill-bld  { height: 100%; border-radius: 2px; background: var(--gold); transition: width .5s; position: relative; overflow: hidden; }
.prog-fill-bld::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
  animation: bar-shine 2s ease-in-out infinite;
}
@keyframes bar-shine { 0%{left:-60%} 100%{left:120%} }

/* Bouton upgrade */
.btn-upgrade {
  width: 100%; padding: 8px;
  font-family: var(--fh); font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
  border: none; border-radius: 8px; cursor: pointer;
  transition: filter .15s, transform .1s;
}
.btn-upgrade:active { transform: scale(.97); filter: brightness(1.1); }
.btn-upgrade.can {
  background: var(--accent); color: #fff;
  box-shadow: 0 4px 14px rgba(232,0,61,.25);
}
.btn-upgrade.wait {
  background: rgba(245,200,66,.12); color: var(--gold);
  border: 1px solid rgba(245,200,66,.25); cursor: default;
}
.btn-upgrade.broke {
  background: rgba(255,255,255,.04); color: var(--muted);
  border: 1px solid rgba(255,255,255,.08); cursor: default;
}
.btn-upgrade.done {
  background: rgba(0,217,126,.10); color: var(--green);
  border: 1px solid rgba(0,217,126,.20); cursor: default;
}

/* Toast */
.toast-qg {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 10px 18px;
  font-family: var(--fh); font-size: 13px; font-weight: 700;
  backdrop-filter: blur(12px);
  opacity: 0; transition: opacity .3s;
  z-index: 100; white-space: nowrap;
  pointer-events: none;
}
.toast-qg.show { opacity: 1; }

.bottom-spacer { height: 32px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:8px">
    <a href="index.html" class="nav-back">← Accueil</a>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="pill pill-budget" id="topBudget">—</div>
    <div class="pill" style="background:rgba(232,0,61,.10);border:1px solid rgba(232,0,61,.25);color:var(--accent);" id="topGP">GP —</div>
  </div>
</div>

<!-- HERO -->
<div class="qg-hero" style="margin-top:46px">
  <div class="qg-eyebrow">Infrastructure</div>
  <div class="qg-title">🏢 QUARTIER GÉNÉRAL</div>
  <div class="qg-sub">Améliorez vos bâtiments pour obtenir des avantages durables · ~10 GP par niveau</div>
</div>

<!-- BONUS ACTIFS -->
<div class="bonus-bar">
  <div class="bonus-bar-title">Bonus actifs</div>
  <div class="bonus-list" id="bonusList">
    <div class="bonus-chip none">Aucun bonus pour l'instant</div>
  </div>
</div>

<a href="academy.html" style="display:block;margin:0 0 14px;padding:12px 14px;background:linear-gradient(135deg,#12000e,#0a0a14);border:1px solid var(--border);border-left:3px solid #f5c842;border-radius:8px;text-decoration:none;color:inherit">
  <div style="font-family:var(--fh);font-weight:900;font-size:14px;color:#f5c842;margin-bottom:4px">🎓 Académie & Feeder Series</div>
  <div style="font-size:12px;color:var(--muted)">F3 · F2 · Équipe réserve · Scouting — hub complet</div>
</a>

<div class="sec-lbl">Bâtiments</div>
<div class="bld-grid" id="bldGrid"></div>

<div class="bottom-spacer"></div>

<div class="toast-qg" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script>
(function(){

/* ══════════════════════════════════════════════════════
   DÉFINITION DES BÂTIMENTS
   - levels: [{cost, races, bonus, label}]
     cost  = coût en M€
     races = GP requis pour compléter
     bonus = clé de bonus stockée dans save.hq
     label = description du bonus
══════════════════════════════════════════════════════ */
var BUILDINGS = [
  {
    id:   'factory',
    icon: '🏭',
    name: 'Usine',
    color:'#e8003d',
    desc: 'Accélère le développement de la voiture',
    levels:[
      {cost:15,  races:8,  bonus:{devBoost:0.05},  label:'+5% pts développement'},
      {cost:30,  races:12, bonus:{devBoost:0.12},  label:'+12% pts développement'},
      {cost:55,  races:16, bonus:{devBoost:0.22},  label:'+22% pts développement'},
      {cost:90,  races:20, bonus:{devBoost:0.35},  label:'+35% pts développement'},
    ]
  },
  {
    id:   'simulator',
    icon: '🔬',
    name: 'Simulateur',
    color:'#a855f7',
    desc: 'Améliore la précision stratégique',
    levels:[
      {cost:20,  races:10, bonus:{stratBoost:1},   label:'Stratégie améliorée N1'},
      {cost:40,  races:14, bonus:{stratBoost:2},   label:'+Réduction erreurs IA'},
      {cost:65,  races:18, bonus:{stratBoost:3},   label:'+Timing arrêts optimisé'},
      {cost:100, races:22, bonus:{stratBoost:4},   label:'Stratégie parfaite N4'},
    ]
  },
  {
    id:   'fitness',
    icon: '🏋️',
    name: 'Centre Fitness',
    color:'#3d7eff',
    desc: 'Améliore la forme et le moral des pilotes',
    levels:[
      {cost:12,  races:8,  bonus:{moraleBoost:3},  label:'+3 moral pilotes/GP'},
      {cost:25,  races:11, bonus:{moraleBoost:6},  label:'+6 moral pilotes/GP'},
      {cost:45,  races:15, bonus:{moraleBoost:10}, label:'+10 moral pilotes/GP'},
      {cost:75,  races:18, bonus:{moraleBoost:15}, label:'+15 moral + récup rapide'},
    ]
  },
  {
    id:   'datacenter',
    icon: '📡',
    name: 'Data Center',
    color:'#00d97e',
    desc: 'Améliore la météo et la télémétrie',
    levels:[
      {cost:18,  races:9,  bonus:{dataBoost:1},    label:'Météo +précise'},
      {cost:35,  races:13, bonus:{dataBoost:2},    label:'+Télémétrie avancée'},
      {cost:60,  races:17, bonus:{dataBoost:3},    label:'+Analyse concurrents'},
      {cost:95,  races:21, bonus:{dataBoost:4},    label:'Data N4 — vision complète'},
    ]
  },
  {
    id:   'medical',
    icon: '🏥',
    name: 'Centre Médical',
    color:'#ff8c42',
    desc: 'Réduit la durée des blessures pilotes',
    levels:[
      {cost:10,  races:7,  bonus:{healBoost:0.10}, label:'-10% durée blessures'},
      {cost:22,  races:10, bonus:{healBoost:0.25}, label:'-25% durée blessures'},
      {cost:40,  races:14, bonus:{healBoost:0.45}, label:'-45% durée blessures'},
      {cost:70,  races:18, bonus:{healBoost:0.65}, label:'-65% + récup rapide'},
    ]
  },
  {
    id:   'academy',
    icon: '🎓',
    name: 'Académie',
    color:'#f5c842',
    desc: 'Accélère la progression des jeunes pilotes',
    levels:[
      {cost:14,  races:9,  bonus:{youngBoost:0.10},label:'+10% progression jeunes'},
      {cost:28,  races:12, bonus:{youngBoost:0.22},label:'+22% progression jeunes'},
      {cost:50,  races:16, bonus:{youngBoost:0.38},label:'+38% progression jeunes'},
      {cost:85,  races:20, bonus:{youngBoost:0.55},label:'+55% + accès talents rares'},
    ]
  },
];

/* ── Charge la save ── */
var save = Save.load();
if(!save.hq) save.hq = {};

/* hq structure par bâtiment :
   {level: 0-4, upgrading: false, startRace: null, targetRace: null} */
BUILDINGS.forEach(function(b){
  if(!save.hq[b.id]) save.hq[b.id] = {level:0, upgrading:false, startRace:null, targetRace:null};
});

var currentRace = save.race || 0;

/* ── Vérifie si des améliorations sont terminées ── */
var upgraded = false;
BUILDINGS.forEach(function(b){
  var st = save.hq[b.id];
  if(st.upgrading && currentRace >= st.targetRace){
    st.level++;
    st.upgrading   = false;
    st.startRace   = null;
    st.targetRace  = null;
    upgraded = true;
  }
});
if(upgraded) Save.save(save);

/* ── Render ── */
function render(){
  renderBonuses();
  renderBuildings();
}

function renderBonuses(){
  var list = document.getElementById('bonusList');
  list.innerHTML = '';
  var any = false;
  BUILDINGS.forEach(function(b){
    var lvl = save.hq[b.id].level;
    if(lvl === 0) return;
    any = true;
    var lv = b.levels[lvl-1];
    var chip = document.createElement('div');
    chip.className = 'bonus-chip';
    chip.innerHTML = b.icon + ' ' + lv.label;
    chip.style.cssText = 'background:rgba('+hexRgb(b.color)+',.10);border-color:rgba('+hexRgb(b.color)+',.25);color:'+b.color;
    list.appendChild(chip);
  });
  if(!any){
    list.innerHTML = '<div class="bonus-chip none">Aucun bonus pour l\'instant</div>';
  }
}

function renderBuildings(){
  var grid = document.getElementById('bldGrid');
  grid.innerHTML = '';

  BUILDINGS.forEach(function(b){
    var st  = save.hq[b.id];
    var lvl = st.level;           // niveaux complétés (0-4)
    var MAX = b.levels.length;    // 4
    var maxed = lvl >= MAX;

    var card = document.createElement('div');
    card.className = 'bld-card' + (st.upgrading?' upgrading':'') + (maxed?' maxed':'');
    card.style.setProperty('--bcolor', b.color);

    /* Étoiles */
    var stars = '';
    for(var i=0;i<MAX;i++){
      stars += '<div class="star'+(i<lvl?' on':'')+'"></div>';
    }

    /* Bonus actuel */
    var bonusHtml = lvl > 0
      ? b.levels[lvl-1].label
      : 'Aucun bonus';
    var bonusClass = lvl > 0 ? '' : ' empty';

    /* Prochain bonus */
    var nextHtml = '';
    if(!maxed && !st.upgrading){
      var nx = b.levels[lvl];
      nextHtml = 'Niveau '+(lvl+1)+' : <strong>'+nx.label+'</strong><br>Coût : <strong>'+nx.cost+'M€</strong> · <strong>'+nx.races+' GP</strong>';
    } else if(st.upgrading){
      var remaining = st.targetRace - currentRace;
      var done = currentRace - st.startRace;
      var total = st.targetRace - st.startRace;
      nextHtml = 'En cours · <strong>'+Math.max(0,remaining)+' GP</strong> restants';
    }

    /* Progression */
    var progHtml = '';
    if(st.upgrading){
      var done2 = currentRace - st.startRace;
      var total2 = st.targetRace - st.startRace;
      var pct = Math.min(100, Math.round(done2/total2*100));
      progHtml =
        '<div class="prog-wrap-bld">'+
          '<div class="prog-lbl"><span>Amélioration N'+(lvl+1)+'</span><span>'+pct+'%</span></div>'+
          '<div class="prog-track-bld"><div class="prog-fill-bld" style="width:'+pct+'%"></div></div>'+
        '</div>';
    }

    /* Bouton */
    var btnHtml = '';
    if(maxed){
      btnHtml = '<button class="btn-upgrade done">✓ Niveau maximum</button>';
    } else if(st.upgrading){
      btnHtml = '<button class="btn-upgrade wait">⏳ En cours ('+Math.max(0,st.targetRace-currentRace)+' GP)</button>';
    } else {
      var nx2 = b.levels[lvl];
      var canAfford = save.budget >= nx2.cost;
      if(canAfford){
        btnHtml = '<button class="btn-upgrade can" onclick="startUpgrade(\''+b.id+'\')">🔨 Améliorer ('+nx2.cost+'M€)</button>';
      } else {
        btnHtml = '<button class="btn-upgrade broke">💸 Budget insuffisant ('+nx2.cost+'M€)</button>';
      }
    }

    /* Niveau label */
    var lvlLabel = maxed
      ? '<span style="color:var(--green)">MAX ⭐</span>'
      : (lvl > 0 ? 'Niveau <span>'+lvl+'</span> / '+MAX : 'Non construit');

    card.innerHTML =
      '<div class="bld-icon">'+b.icon+'</div>'+
      '<div class="bld-name">'+b.name+'</div>'+
      '<div class="bld-level">'+lvlLabel+'</div>'+
      '<div class="stars">'+stars+'</div>'+
      '<div class="bld-bonus'+bonusClass+'">'+bonusHtml+'</div>'+
      (nextHtml?'<div class="bld-next">'+nextHtml+'</div>':'')+
      progHtml+
      btnHtml;

    grid.appendChild(card);
  });
}

/* ── Lance une amélioration ── */
window.startUpgrade = function(buildingId){
  var b   = BUILDINGS.find(function(x){return x.id===buildingId;});
  var st  = save.hq[buildingId];
  var lvl = st.level;
  if(lvl >= b.levels.length || st.upgrading) return;

  var nx = b.levels[lvl];
  if(save.budget < nx.cost){ toast('💸 Budget insuffisant !'); return; }

  save.budget   -= nx.cost;
  st.upgrading   = true;
  st.startRace   = currentRace;
  st.targetRace  = currentRace + nx.races;
  Save.save(save);

  toast('🔨 Amélioration de '+b.name+' lancée ! Terminée dans '+nx.races+' GP.');
  updateTopbar();
  render();
};

/* ── Topbar ── */
function updateTopbar(){
  document.getElementById('topBudget').textContent = Math.round(save.budget||0)+'M€';
  document.getElementById('topGP').textContent = 'GP '+(save.race||0);
}

/* ── Toast ── */
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

/* ── Utils ── */
function hexRgb(h){
  return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
}

updateTopbar();
render();

})();
</script>
</body>
</html>
