<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/immersive-theme.css?v=20260712">
<script src="js/icons.js"></script>
<title>Académie & Feeder — F1 Manager</title>
<style>
.page{max-width:820px;margin:0 auto;padding:10px 8px 48px}
.hero{background:linear-gradient(135deg,#12000e,#07070d);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.hero-kicker{font-family:var(--fh);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.hero-title{font-family:var(--fh);font-weight:900;font-size:24px;letter-spacing:1px}
.hero-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.pipe-step{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
.pipe-step b{display:block;font-family:var(--fh);font-weight:900;font-size:20px;color:var(--gold)}
.pipe-step span{font-family:var(--fh);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.pipe-arrow{display:none}
.tab-bar{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tab-btn{font-family:var(--fh);font-size:11px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-pane{display:none}.tab-pane.active{display:block}
.st-table{width:100%;border-collapse:collapse;font-family:var(--fh);font-size:12px}
.st-table th{text-align:left;padding:8px 6px;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.st-table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.st-table tr.player-row{background:rgba(245,200,66,.06)}
.st-table tr:hover{background:var(--surface2)}
.pos{font-weight:900;width:28px}.pos.p1{color:var(--gold)}.pos.p2{color:#c0c0c0}.pos.p3{color:#cd7f32}
.dname{font-weight:700}.dteam{font-size:10px;color:var(--muted)}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.btn-xs{font-family:var(--fh);font-size:10px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.btn-xs.gold{border-color:var(--gold);color:var(--gold)}
.btn-xs.red{border-color:var(--accent);color:var(--accent)}
.jr-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.jr-card.player-owned{border-color:var(--gold)}
.jr-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.jr-flag{font-size:22px}
.jr-name{font-family:var(--fh);font-weight:900;font-size:16px;flex:1}
.jr-badge{font-family:var(--fh);font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border)}
.jr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.jr-stat{background:var(--surface2);border-radius:6px;padding:6px;text-align:center;font-family:var(--fh)}
.jr-stat b{display:block;font-size:14px}.jr-stat span{font-size:9px;color:var(--muted)}
.round-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#ccc}
.reserve-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:6px;padding:10px 18px;font-family:var(--fh);font-size:13px;z-index:500;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{border-left-color:var(--accent)}
.alert-card{background:linear-gradient(135deg,#1a1008,#120008);border:1px solid rgba(232,0,61,.35);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:12px}
.dev-plan{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dev-plan button{font-family:var(--fh);font-size:10px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);cursor:pointer}
.dev-plan button.on{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.08)}
.scout-bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:4px;overflow:hidden}
.scout-fill{height:100%;background:var(--info);transition:width .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:600;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;max-width:360px;width:100%}
.modal-box h3{font-family:var(--fh);font-weight:900;font-size:16px;margin:0 0 10px}
.modal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.modal-row input{width:80px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-family:var(--fh)}
.hist-season{margin-bottom:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.hist-spark{display:flex;align-items:flex-end;gap:3px;height:36px;margin:8px 0}
.hist-bar{flex:1;background:var(--info);border-radius:2px 2px 0 0;min-width:4px;opacity:.85}
.hist-bar.p1{background:var(--gold)}.hist-bar.p2{background:#c0c0c0}.hist-bar.p3{background:#cd7f32}
.deadline{font-family:var(--fh);font-size:10px;color:var(--accent);margin-top:4px}
.budget-pill{display:inline-block;font-family:var(--fh);font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(0,180,255,.12);color:var(--info);border:1px solid rgba(0,180,255,.25);margin-left:8px}
@media(max-width:640px){.pipeline{grid-template-columns:repeat(3,1fr)}.st-table .hide-m{display:none}}
</style>
</head>
<body>
<div class="topbar topbar--glass">
  <div class="logo"><img src="img/f1.png" style="height:22px;vertical-align:middle;margin-right:4px" alt="F1"><span style="color:#fff">Manager</span></div>
  <a href="index.html" class="nav-back">← Hub</a>
</div>

<div class="page">
  <section class="hero">
    <div class="hero-kicker">Centre de formation</div>
    <div class="hero-title">Académie & Feeder Series</div>
    <div class="hero-sub" id="heroSub">Pipeline F3 → F2 → Réserve → F1. Championnats simulés à chaque GP — style Football Manager.</div>
    <div class="pipeline" id="pipeline"></div>
  </section>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="overview" onclick="showTab('overview',this)">📊 Vue d'ensemble</button>
    <button class="tab-btn" data-tab="academy" onclick="showTab('academy',this)">🌱 Académie</button>
    <button class="tab-btn" data-tab="f3" onclick="showTab('f3',this)">F3</button>
    <button class="tab-btn" data-tab="f2" onclick="showTab('f2',this)">F2</button>
    <button class="tab-btn" data-tab="reserve" onclick="showTab('reserve',this)">🔵 Réserve</button>
    <button class="tab-btn" data-tab="scout" onclick="showTab('scout',this)">🔭 Scouting</button>
    <button class="tab-btn" data-tab="history" onclick="showTab('history',this)">📚 Historique</button>
  </div>

  <div id="tab-overview" class="tab-pane active"></div>
  <div id="tab-academy" class="tab-pane"></div>
  <div id="tab-f3" class="tab-pane"></div>
  <div id="tab-f2" class="tab-pane"></div>
  <div id="tab-reserve" class="tab-pane"></div>
  <div id="tab-scout" class="tab-pane"></div>
  <div id="tab-history" class="tab-pane"></div>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="negModal" onclick="if(event.target===this)closeNegModal()">
  <div class="modal-box">
    <h3 id="negTitle">Négociation contrat</h3>
    <div id="negBody"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-xs gold" onclick="submitNegOffer()">Proposer</button>
      <button class="btn-xs" onclick="closeNegModal()">Annuler</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dossierModal" onclick="if(event.target===this)closeDossierModal()">
  <div class="modal-box" style="max-width:420px">
    <h3 id="dossierTitle">Fiche pilote</h3>
    <div id="dossierBody"></div>
    <button class="btn-xs" style="margin-top:12px" onclick="closeDossierModal()">Fermer</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/career.js"></script>
<script src="js/immersion.js"></script>
<script src="js/feeder.js"></script>
<script src="js/theme.js"></script>
<script>
let save = Save.load();
if (!save?.playerTeamId) location.href = 'index.html';
Immersion.ensure(save);
Feeder.ensure(save);
if (typeof Save.restoreRivalStats === 'function') Save.restoreRivalStats(save);

const team = F1Data.teams.find(t => t.id === save.playerTeamId);
let negCtx = null;

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!err);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function showTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  renderTab(id);
}

function renderPipeline() {
  const p = Feeder.getPipelineSummary(save);
  const boost = Math.round(Feeder.getAcademyBoost(save) * 100);
  document.getElementById('pipeline').innerHTML = [
    ['Académie', p.academy], ['F3', p.f3owned], ['F2', p.f2owned], ['Réserve', p.reserve], ['F1', p.titulaires],
  ].map(([l, v]) => `<div class="pipe-step"><b>${v}</b><span>${l}</span></div>`).join('');
  document.getElementById('heroSub').textContent =
    `${team?.name || 'Équipe'} · Budget F1 ${save.budget ?? 0}M€ · Budget académie ${(save.feeder.academyBudget ?? 0).toFixed(1)}M€ · Bonus HQ +${boost}% · F3 R${save.feeder.f3.round}/${save.feeder.f3.totalRounds} · F2 R${save.feeder.f2.round}/${save.feeder.f2.totalRounds}`;
}

function renderOverview() {
  const f3 = save.feeder.f3;
  const f2 = save.feeder.f2;
  const f3s = Feeder.getStandings(save, 'f3').slice(0, 5);
  const f2s = Feeder.getStandings(save, 'f2').slice(0, 5);
  const lr3 = f3.lastRound;
  const lr2 = f2.lastRound;
  const alerts = Feeder.getPendingPoaching(save);
  const activeLoans = (save.feeder.loans || []).filter(l => l.active);
  const incomingLoans = (save.feeder.incomingLoans || []).filter(l => l.active);
  const currentRace = save.race || 0;
  const perf = Feeder.getPerformanceSummary(save);
  const lastB = perf.lastBonus;

  document.getElementById('tab-overview').innerHTML = `
    <div class="round-box" style="border-left:3px solid var(--info)">
      <strong style="color:var(--info)">🏎️ ${esc(perf.teamName)} — équipe satellite (passive)</strong><br>
      <span style="font-size:12px;color:#ccc">
        F2 écurie : <strong>P${perf.f2TeamPos || '—'}</strong> (${perf.f2TeamPts} pts constructeur) ·
        F3 écurie : <strong>P${perf.f3TeamPos || '—'}</strong> (${perf.f3TeamPts} pts)
      </span><br>
      <span style="font-size:11px;color:var(--muted)">
        Bonus saison cumulés : +${(perf.seasonBonuses.f1 || 0).toFixed(1)}M€ F1 · +${(perf.seasonBonuses.academy || 0).toFixed(1)}M€ académie · +${Math.round(perf.seasonBonuses.junior || 0)}% progression juniors
      </span>
      ${lastB ? `<div style="font-size:11px;color:var(--gold);margin-top:6px">Dernier bonus (F${lastB.series.toUpperCase()} R${lastB.round}) : ${lastB.highlights?.join(', ') || ''} → +${lastB.academy}M€ acad.${lastB.f1 ? ` · +${lastB.f1}M€ F1` : ''}</div>` : ''}
    </div>
    ${alerts.length ? `<div style="margin-bottom:10px">${alerts.map(a => {
      const d = save.feeder[a.series].drivers.find(x => x.id === a.driverId);
      const nm = d ? `${d.firstName} ${d.name}` : 'Pilote';
      const gpLeft = Math.max(0, a.deadlineRace - currentRace);
      return `<div class="alert-card">
        <strong style="color:var(--accent)">👀 ${esc(a.rivalTeamName)} convoite ${esc(nm)}</strong><br>
        <span style="color:var(--muted)">Indemnité si départ : ${a.buyout}M€ · Garder : ${a.keepCost}M€</span>
        <div class="deadline">⏱ ${gpLeft <= 0 ? 'DERNIER GP — répondez maintenant' : `${gpLeft} GP restant${gpLeft > 1 ? 's' : ''} (deadline GP${a.deadlineRace})`}</div>
        <div class="actions" style="margin-top:8px">
          <button class="btn-xs gold" onclick="doPoach('${a.id}','keep')">🔒 Garder (${a.keepCost}M)</button>
          <button class="btn-xs" onclick="doPoach('${a.id}','accept')">💸 Vendre (+${a.buyout}M)</button>
          <button class="btn-xs red" onclick="doPoach('${a.id}','decline')">Refuser</button>
        </div>
      </div>`;
    }).join('')}</div>` : ''}
    ${activeLoans.length ? `<div class="round-box">🔄 Prêts sortants : ${activeLoans.map(l => {
      const d = F1Data.drivers.find(x => x.id === l.driverId);
      const nm = d ? `${d.firstName} ${d.name}` : 'Réserve';
      return `${nm} → ${l.teamName} (retour GP${l.endRace})`;
    }).join(' · ')}</div>` : ''}
    ${incomingLoans.length ? `<div class="round-box">📥 Prêts entrants : ${incomingLoans.map(l => {
      const d = F1Data.drivers.find(x => x.id === l.driverId);
      const nm = d ? `${d.firstName} ${d.name}` : 'Pilote';
      const gpLeft = Math.max(0, l.endRace - currentRace);
      return `${nm} — option ${l.buyout}M€ · ${gpLeft} GP restant${gpLeft > 1 ? 's' : ''}`;
    }).join(' · ')}</div>` : ''}
    <div class="round-box">
      <strong style="color:var(--gold)">Équipe F2 satellite</strong> — simulée à chaque GP F1, sans micro-gestion obligatoire.<br>
      <span style="font-size:11px;color:var(--muted)">Victoire F2 : +0,45M€ acad. + 0,2M€ F1 · Podium : +0,22M€ acad. · Top 5 équipe fin de saison : prime bonus.</span>
    </div>
    ${lr3 ? `<div class="round-box">🏁 <strong>F3 — ${esc(lr3.name)}</strong> (R${lr3.round}) · Podium : ${lr3.top3.map(t=>esc(t.name)).join(', ')}</div>` : ''}
    ${lr2 ? `<div class="round-box">🏎️ <strong>F2 — ${esc(lr2.name)}</strong> (R${lr2.round}) · Podium : ${lr2.top3.map(t=>esc(t.name)).join(', ')}</div>` : ''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="jr-card"><div class="jr-name" style="margin-bottom:8px">Top 5 F3</div>${miniStandings(f3s)}</div>
      <div class="jr-card"><div class="jr-name" style="margin-bottom:8px">Top 5 F2</div>${miniStandings(f2s)}</div>
    </div>`;
}

function miniStandings(rows) {
  if (!rows.length) return '<div style="color:var(--muted);font-size:12px">Aucun résultat</div>';
  return rows.map(r => `<div style="font-family:var(--fh);font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
    <span style="color:var(--gold);font-weight:900">P${r.position}</span> ${esc(r.firstName)} ${esc(r.name)}
    <span style="color:var(--muted);float:right">${r.points} pts</span></div>`).join('');
}

function renderAcademy() {
  const im = save.immersion;
  const juniors = im.juniorAcademy || [];
  document.getElementById('tab-academy').innerHTML = `
    <div class="round-box">🎓 <strong>${Feeder.playerAcademyTeamName(save)}</strong> en F3 · ${juniors.filter(j=>!j.promoted).length} juniors en formation · Bonus HQ +${Math.round(Feeder.getAcademyBoost(save)*100)}%</div>
    ${juniors.length ? juniors.map(j => renderJuniorCard(j)).join('') : '<div class="jr-card">Aucun junior — fin de saison en approche.</div>'}
  `;
}

function renderJuniorCard(j) {
  const isPlayer = !j.promoted;
  const stage = j.stage || 'academy';
  const badge = j.promoted ? '✅ F1' : j.promotable ? '⭐ Promouvable' : stage === 'f3' ? 'F3' : stage === 'f2' ? 'F2' : stage === 'reserve' ? '🔵 Réserve' : '⏳ Formation';
  const prof = j.profile;
  const devPlan = save.feeder.devPlans?.[j.id] || '';
  const devBtns = Feeder.DEV_PLANS.map(p =>
    `<button class="${devPlan === p.id ? 'on' : ''}" onclick="doSetDevPlan('${j.id}','${p.id}')">${p.icon} ${p.label}</button>`
  ).join('');
  return `<div class="jr-card${j.ownedBy || j.feederId ? ' player-owned' : ''}">
    <div class="jr-head">
      <span class="jr-flag">${j.flag || '🏁'}</span>
      <div class="jr-name">${esc(j.firstName)} ${esc(j.name)} <span style="font-size:11px;color:var(--muted)">${j.age || '?'} ans · Pot. ${j.potential || '?'}</span></div>
      <span class="jr-badge">${badge}</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${esc(j.note || 'En développement.')}</div>
    <div class="jr-stats">
      <div class="jr-stat"><b>${j.progress ?? 0}%</b><span>Progression</span></div>
      <div class="jr-stat"><b>${j.paliers ?? 0}</b><span>Paliers</span></div>
      <div class="jr-stat"><b>${j.fpSeasonCount ?? 0}/2</b><span>EL/saison</span></div>
      <div class="jr-stat"><b>${prof?.ovr ?? '—'}</b><span>OVR profil</span></div>
    </div>
    ${!j.promoted ? `<div class="dev-plan" title="Plan de développement — accélère progression chaque GP">${devBtns}</div>` : ''}
    ${!j.promoted && j.promotable ? `<div class="actions">
      <button class="btn-xs gold" onclick="doPromoteJunior('${j.id}')">🏁 Promouvoir F1</button>
      ${!j.feederId ? `<button class="btn-xs" onclick="doEnrollF3('${j.id}')">📋 Envoyer en F3</button>` : ''}
      <button class="btn-xs" onclick="doReleaseJunior('${j.id}','${esc(j.firstName)} ${esc(j.name)}')">🚪 Libérer</button>
    </div>` : ''}
    ${!j.promoted && !j.promotable ? `<button class="btn-xs" onclick="doReleaseJunior('${j.id}','${esc(j.firstName)} ${esc(j.name)}')">🚪 Libérer de l'académie</button>` : ''}
  </div>`;
}

function seriesTable(series) {
  const s = save.feeder[series];
  const rows = Feeder.getStandings(save, series);
  const reserveCount = (save.feeder.reserve.driverIds || []).length;
  return `
    <div class="round-box">Saison ${s.season} · Round <strong>${s.round}/${s.totalRounds}</strong> · ${rows.length} pilotes · Réserve ${reserveCount}/${Feeder.RESERVE_MAX}</div>
    <div style="overflow-x:auto">
    <table class="st-table">
      <thead><tr><th>#</th><th>Pilote</th><th class="hide-m">Écurie</th><th>Pts</th><th class="hide-m">V</th><th>Actions</th></tr></thead>
      <tbody>${rows.map(r => {
        const owned = r.ownedBy === save.playerTeamId;
        const watched = Feeder.isWatched(save, r.id, series);
        const vis = Feeder.visibleStats(save, series, r);
        const scoutPct = vis.level;
        return `<tr class="${owned ? 'player-row' : ''}">
          <td class="pos${r.position <= 3 ? ' p' + r.position : ''}">${r.position}</td>
          <td><div class="dname"><a href="#" onclick="openDossier('${r.id}','${series}');return false" style="color:inherit;text-decoration:none">${r.flag || ''} ${esc(r.firstName)} ${esc(r.name)}</a>${owned ? ' <span style="color:var(--gold);font-size:10px">★</span>' : ''}</div>
            <div class="dteam">${esc(r.teamName)} · Pace ${vis.pace} · Cons ${vis.consistency} · Pot.${vis.potential}</div>
            <div class="scout-bar"><div class="scout-fill" style="width:${scoutPct}%"></div></div>
            <div style="font-size:9px;color:var(--muted)">Scout ${scoutPct}%${vis.personality ? ' · ' + vis.personality : ''}</div></td>
          <td class="hide-m">${esc(r.teamName)}</td>
          <td><strong>${r.points}</strong></td>
          <td class="hide-m">${r.wins || 0}</td>
          <td><div class="actions">
            <button class="btn-xs" onclick="doWatch('${r.id}','${series}')">${watched ? '★' : '☆'}</button>
            ${!owned && scoutPct < 100 ? `<button class="btn-xs" onclick="doScout('${r.id}','${series}')">🔍 Scout</button>` : ''}
            ${series === 'f2' && !owned ? `<button class="btn-xs gold" onclick="openNegModal('${r.id}','${series}')">📝 Négocier</button>` : ''}
            ${series === 'f2' && !owned && scoutPct >= 60 ? `<button class="btn-xs" onclick="doIncomingLoan('${r.id}')">📥 Prêt entrant</button>` : ''}
            ${series === 'f2' && owned ? `<button class="btn-xs gold" onclick="doSignReserve('${r.id}','${series}')">🔵 Réserve</button>` : ''}
            ${series === 'f3' && owned ? `<button class="btn-xs" onclick="doPromoteF2('${r.id}')">↑ F2</button>` : ''}
            ${series === 'f3' && owned ? `<button class="btn-xs gold" onclick="doSignReserve('${r.id}','${series}')">🔵 Réserve</button>` : ''}
          </div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

function renderReserve() {
  const drivers = Feeder.getReserveDrivers(save);
  const slots = save.feeder.reserve.maxSlots || Feeder.RESERVE_MAX;
  document.getElementById('tab-reserve').innerHTML = `
    <div class="round-box">🔵 <strong>Équipe réserve</strong> — ${drivers.length}/${slots} slot(s). Les réservistes peuvent rouler aux EL et être promus titulaires.</div>
    ${drivers.length ? drivers.map(d => {
      const c = save.contracts?.[d.id] || {};
      const isLoanIn = c.status === 'loan_in';
      const loanRec = (save.feeder.incomingLoans || []).find(l => l.active && l.driverId === d.id);
      return `<div class="reserve-card">
        <div style="font-size:28px">${d.flag || '🏁'}</div>
        <div style="flex:1">
          <div style="font-family:var(--fh);font-weight:900;font-size:16px">${esc(d.firstName)} ${esc(d.name)} ${isLoanIn ? '<span class="jr-badge">Prêt entrant</span>' : ''}</div>
          <div style="font-size:11px;color:var(--muted)">${d.age}a · Pace ${d.pace} · ${c.salary || d.salary}M€/an${isLoanIn && loanRec ? ` · Option ${loanRec.buyout}M€ · fin GP${loanRec.endRace}` : ` · ${c.years || 2} ans`}</div>
        </div>
        <div class="actions">
          ${isLoanIn && loanRec ? `<button class="btn-xs gold" onclick="doBuyLoan('${d.id}')">✅ Acheter (${loanRec.buyout}M)</button>` : ''}
          ${!isLoanIn ? `<button class="btn-xs gold" onclick="doPromoteReserve('${d.id}')">🏁 Titulaire</button>` : ''}
          ${!isLoanIn ? `<button class="btn-xs" onclick="doLoanReserve('${d.id}')">🔄 Prêt F2</button>` : ''}
          <button class="btn-xs red" onclick="doReleaseReserve('${d.id}','${esc(d.firstName)} ${esc(d.name)}')">Libérer</button>
        </div>
      </div>`;
    }).join('') : '<div class="jr-card" style="color:var(--muted);font-size:13px">Aucun pilote réserve. Signez un talent depuis le championnat F2 ou un prêt entrant.</div>'}
  `;
}

function renderScout() {
  const wl = save.feeder.watchlist || [];
  const watched = [];
  ['f3', 'f2'].forEach(series => {
    Feeder.getStandings(save, series).forEach(d => {
      if (Feeder.isWatched(save, d.id, series)) watched.push({ ...d, series });
    });
  });
  document.getElementById('tab-scout').innerHTML = `
    <div class="round-box">🔭 Shortlist · Scout complet (100%) = stats exactes + personnalité visible.<br>Coût scouting : <strong>${Feeder.SCOUT_COST}M€</strong> (budget académie) · Disponible : <strong>${(save.feeder.academyBudget ?? 0).toFixed(1)}M€</strong></div>
    ${watched.length ? watched.map(d => {
      const vis = Feeder.visibleStats(save, d.series, d);
      return `<div class="jr-card">
      <div class="jr-head"><span class="jr-flag">${d.flag||'🏁'}</span>
        <div class="jr-name">${d.series.toUpperCase()} · ${esc(d.firstName)} ${esc(d.name)}</div>
        <span class="jr-badge">P${d.position} · Scout ${vis.level}%</span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Pace ${vis.pace} · Cons ${vis.consistency} · Pluie ${vis.wetSkill} · Pot.${vis.potential} · Salaire ${vis.salaryAsk}M</div>
      <div class="actions">
        ${vis.level < 100 ? `<button class="btn-xs" onclick="doScout('${d.id}','${d.series}')">🔍 Scout (+${Feeder.SCOUT_GAIN}%)</button>` : ''}
        ${d.series === 'f2' ? `<button class="btn-xs gold" onclick="openNegModal('${d.id}','${d.series}')">📝 Négocier</button>` : ''}
        <button class="btn-xs" onclick="doWatch('${d.id}','${d.series}')">Retirer watchlist</button>
      </div>
    </div>`;
    }).join('') : '<div class="jr-card" style="color:var(--muted)">Watchlist vide — cliquez ☆ sur un pilote F2/F3.</div>'}
    <div style="margin-top:12px;font-family:var(--fh);font-size:11px;color:var(--muted)">${wl.length} pilote(s) suivis · Budget ${save.budget}M€</div>
  `;
}

function renderHistory() {
  const hist = (save.feeder.history || []).slice().reverse();
  document.getElementById('tab-history').innerHTML = hist.length ? hist.map(h => `
    <div class="hist-season">
      <div style="font-family:var(--fh);font-weight:900;font-size:15px;color:var(--gold);margin-bottom:8px">Saison ${h.season}</div>
      ${h.f3?.champion ? `<div style="font-size:12px;margin-bottom:4px">🏆 F3 : <strong>${esc(h.f3.champion.name)}</strong> (${esc(h.f3.champion.team)}) — ${h.f3.champion.points} pts</div>` : ''}
      ${h.f3?.playerBest ? `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Votre meilleur F3 : ${esc(h.f3.playerBest.name)} P${h.f3.playerBest.pos} (${h.f3.playerBest.points} pts)</div>` : ''}
      ${h.f2?.champion ? `<div style="font-size:12px;margin-bottom:4px">🏆 F2 : <strong>${esc(h.f2.champion.name)}</strong> (${esc(h.f2.champion.team)}) — ${h.f2.champion.points} pts</div>` : ''}
      ${h.f2?.teamPos ? `<div style="font-size:11px;color:var(--info);margin-bottom:4px">Écurie F2 : P${h.f2.teamPos} (${h.f2.teamPts || 0} pts)${h.seasonBonus ? ` · Prime +${h.seasonBonus.academy}M€ acad.${h.seasonBonus.f1 ? ` +${h.seasonBonus.f1}M€ F1` : ''}` : ''}</div>` : ''}
      ${h.f2?.playerBest ? `<div style="font-size:11px;color:var(--muted)">Votre meilleur F2 : ${esc(h.f2.playerBest.name)} P${h.f2.playerBest.pos} (${h.f2.playerBest.points} pts)</div>` : ''}
      <details style="margin-top:8px;font-size:11px;color:#aaa"><summary>Top 10 F3/F2</summary>
        <div style="margin-top:6px">F3 : ${(h.f3?.top10||[]).map(t=>`${t.name} (${t.points})`).join(', ') || '—'}</div>
        <div style="margin-top:4px">F2 : ${(h.f2?.top10||[]).map(t=>`${t.name} (${t.points})`).join(', ') || '—'}</div>
      </details>
    </div>
  `).join('') : '<div class="jr-card" style="color:var(--muted)">Aucun historique — termine une saison F1.</div>';
}

function renderTab(id) {
  renderPipeline();
  if (id === 'overview') renderOverview();
  else if (id === 'academy') renderAcademy();
  else if (id === 'f3') document.getElementById('tab-f3').innerHTML = seriesTable('f3');
  else if (id === 'f2') document.getElementById('tab-f2').innerHTML = seriesTable('f2');
  else if (id === 'reserve') renderReserve();
  else if (id === 'scout') renderScout();
  else if (id === 'history') renderHistory();
}

function doWatch(id, series) {
  Feeder.toggleWatchlist(save, id, series);
  Save.save(save);
  renderTab(document.querySelector('.tab-pane.active')?.id?.replace('tab-', '') || 'overview');
}

function doSignReserve(id, series, offer) {
  const r = Feeder.signToReserve(save, id, series, offer || null);
  toast(r.ok ? `✅ ${r.driver.firstName} ${r.driver.name} signé${r.fee ? ' (' + r.fee + 'M€)' : ''}` : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); closeNegModal(); showTab('reserve', document.querySelector('[data-tab=reserve]')); }
}

function openNegModal(id, series) {
  const ev = Feeder.evaluateFeederOffer(save, series, id, {});
  if (!ev.ok) { toast(ev.msg, true); return; }
  negCtx = { id, series };
  const d = save.feeder[series].drivers.find(x => x.id === id);
  document.getElementById('negTitle').textContent = `Négociation — ${d.firstName} ${d.name}`;
  document.getElementById('negBody').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Scout ${ev.scoutLevel}% · Demande initiale affichée ci-dessous</div>
    <div class="modal-row"><span>Droits d'engagement (M€)</span><input type="number" step="0.1" id="negFee" value="${ev.demand.fee}"></div>
    <div class="modal-row"><span>Salaire (M€/an)</span><input type="number" step="0.1" id="negSalary" value="${ev.demand.salary}"></div>
    <div class="modal-row"><span>Durée (ans)</span><input type="number" id="negYears" value="${ev.demand.years}"></div>
    <div id="negPreview" style="font-size:11px;color:var(--gold);margin-top:8px"></div>
  `;
  ['negFee','negSalary','negYears'].forEach(el => {
    document.getElementById(el).addEventListener('input', updateNegPreview);
  });
  updateNegPreview();
  document.getElementById('negModal').classList.add('open');
}

function updateNegPreview() {
  if (!negCtx) return;
  const offer = {
    fee: parseFloat(document.getElementById('negFee').value),
    salary: parseFloat(document.getElementById('negSalary').value),
    years: parseInt(document.getElementById('negYears').value, 10),
  };
  const ev = Feeder.evaluateFeederOffer(save, negCtx.series, negCtx.id, offer);
  document.getElementById('negPreview').textContent = ev.ok
    ? `Probabilité d'acceptation : ~${ev.chance}%`
    : ev.msg;
}

function submitNegOffer() {
  if (!negCtx) return;
  const offer = {
    fee: parseFloat(document.getElementById('negFee').value),
    salary: parseFloat(document.getElementById('negSalary').value),
    years: parseInt(document.getElementById('negYears').value, 10),
  };
  doSignReserve(negCtx.id, negCtx.series, offer);
}

function closeNegModal() {
  document.getElementById('negModal').classList.remove('open');
  negCtx = null;
}

function openDossier(id, series) {
  const dossier = Feeder.getDriverDossier(save, series, id);
  if (!dossier) { toast('Fiche introuvable', true); return; }
  const d = dossier.driver;
  const vis = dossier.visible;
  const hist = dossier.roundHistory || [];
  const maxPos = 15;
  const spark = hist.length ? `<div class="hist-spark">${hist.map(h => {
    const hPct = Math.max(12, 100 - ((h.position - 1) / maxPos) * 100);
    const cls = h.position <= 3 ? ` p${h.position}` : '';
    return `<div class="hist-bar${cls}" style="height:${hPct}%" title="R${h.round} ${esc(h.name)} — P${h.position}"></div>`;
  }).join('')}</div>
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px">${hist.map(h => `R${h.round}:P${h.position}`).join(' · ')}</div>` : '<div style="font-size:11px;color:var(--muted);margin:8px 0">Pas encore de round disputé.</div>';
  const trendTxt = dossier.trend < 0 ? '📈 En progression' : dossier.trend > 0 ? '📉 En baisse' : '➡️ Stable';

  document.getElementById('dossierTitle').textContent = `${d.flag || ''} ${d.firstName} ${d.name}`;
  document.getElementById('dossierBody').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${series.toUpperCase()} · ${esc(d.teamName)} · ${d.age}a · Scout ${vis.level}%</div>
    <div class="jr-stats" style="margin-bottom:10px">
      <div class="jr-stat"><b>P${dossier.position}</b><span>Classement</span></div>
      <div class="jr-stat"><b>${dossier.points}</b><span>Points</span></div>
      <div class="jr-stat"><b>${dossier.wins}/${dossier.podiums}</b><span>V/Podiums</span></div>
      <div class="jr-stat"><b>${vis.potential}</b><span>Potentiel</span></div>
    </div>
    <div style="font-size:12px;margin-bottom:8px">Pace ${vis.pace} · Cons ${vis.consistency} · Pluie ${vis.wetSkill} · ${trendTxt}</div>
    ${vis.personality ? `<div style="font-size:11px;color:var(--gold);margin-bottom:8px">${Feeder.personalityLabel(d.personality)}</div>` : ''}
    <div style="font-family:var(--fh);font-size:10px;color:var(--muted);margin-bottom:4px">FORME RÉCENTE</div>
    ${spark}
    ${series === 'f2' && !dossier.owned && vis.level >= 60 ? `<button class="btn-xs" style="margin-top:8px" onclick="closeDossierModal();doIncomingLoan('${id}')">📥 Demander prêt entrant</button>` : ''}
  `;
  document.getElementById('dossierModal').classList.add('open');
}

function closeDossierModal() {
  document.getElementById('dossierModal').classList.remove('open');
}

function doIncomingLoan(id) {
  const r = Feeder.requestIncomingLoan(save, 'f2', id);
  toast(r.ok ? `📥 ${r.driver.firstName} ${r.driver.name} — prêt ${r.duration} GP (option ${r.buyout}M€)` : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); showTab('reserve', document.querySelector('[data-tab=reserve]')); }
}

function doBuyLoan(driverId) {
  const loan = (save.feeder.incomingLoans || []).find(l => l.active && l.driverId === driverId);
  if (!loan) return;
  if (!confirm(`Lever l'option d'achat pour ${loan.buyout}M€ (budget F1) ?`)) return;
  const r = Feeder.buyIncomingLoan(save, driverId);
  toast(r.ok ? `✅ Option levée — ${loan.buyout}M€` : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); renderTab('reserve'); }
}

function doScout(id, series) {
  const r = Feeder.scoutDriver(save, id, series);
  toast(r.ok ? r.msg : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); renderTab(document.querySelector('.tab-pane.active')?.id?.replace('tab-', '') || 'f2'); }
}

function doSetDevPlan(juniorId, planId) {
  Feeder.setDevPlan(save, juniorId, planId);
  save = Save.load();
  toast('Plan de développement mis à jour');
  renderTab('academy');
}

function doPoach(alertId, action) {
  const r = Feeder.respondPoaching(save, alertId, action);
  toast(r.ok ? r.msg : r.msg, !r.ok);
  save = Save.load();
  renderTab('overview');
}

function doLoanReserve(driverId) {
  const r = Feeder.loanReserveToFeeder(save, driverId, 'f2');
  toast(r.ok ? `🔄 Prêté à ${r.team} pour ${r.duration} GP` : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); renderTab('reserve'); }
}

function doPromoteF2(id) {
  const r = Feeder.promoteF3toF2(save, id);
  toast(r.ok ? `✅ Promu en F2` : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); showTab('f2', document.querySelector('[data-tab=f2]')); }
}

function doEnrollF3(juniorId) {
  const j = save.immersion.juniorAcademy.find(x => x.id === juniorId);
  if (!j) return;
  if ((j.paliers || 0) < 1) { toast('Atteignez au moins 1 palier de progression.', true); return; }
  Feeder.enrollAcademyJuniorInF3(save, j);
  Save.save(save);
  toast(`✅ ${j.firstName} ${j.name} engagé en F3`);
  renderTab('academy');
}

function doPromoteJunior(juniorId) {
  const promotedIds = (save.immersion?.juniorAcademy || []).filter(j => j.promoted).map(j => j.driverId).filter(Boolean);
  const current = F1Data.drivers.filter(d => d.teamId === save.playerTeamId && !d.retired && !promotedIds.includes(d.id));
  let replaceId = null;
  if (current.length >= 2) {
    const names = current.map((d, i) => `${i + 1}. ${d.firstName} ${d.name}`).join('\n');
    const pick = prompt(`Qui remplacer ?\n${names}\nEntrez le numéro (1 ou 2) :`);
    const idx = parseInt(pick, 10) - 1;
    if (!Number.isFinite(idx) || !current[idx]) return;
    replaceId = current[idx].id;
  }
  const r = Immersion.promoteJunior(save, juniorId, replaceId);
  toast(r.ok ? r.msg : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); renderTab('academy'); }
}

function doReleaseJunior(juniorId, name) {
  if (!confirm(`Libérer ${name} ? Il deviendra agent libre sur le marché.`)) return;
  const j = save.immersion.juniorAcademy.find(x => x.id === juniorId);
  if (!j) return;
  if (!j.profile && j.promotable) j.profile = Immersion.generateJuniorProfile(j, save);
  const stats = j.profile?.stats || {};
  const ovr = Math.min(77, Math.round(j.profile?.ovr || 66));
  const freeDriver = {
    id: `FA_${j.id}_${save.season || 2025}`, firstName: j.firstName, name: j.name, flag: j.flag,
    teamId: 'free_agent', number: 10 + Math.floor(Math.random() * 89), age: j.age || 18,
    potential: j.potential || 78, trait: j.profile?.traits?.[0] || 'prodigy', retired: false,
    generated: true, fromAcademy: true, academyReleased: true,
    pace: Math.min(77, stats.pace || 66), consistency: Math.min(77, stats.consistency || 64),
    wetSkill: Math.min(77, stats.wetSkill || 63), overtaking: Math.min(77, stats.overtaking || 63),
    defending: Math.min(77, stats.defending || 62),
    salary: Math.max(1, Math.min(3, Math.round(ovr * 0.035))), contractYears: 0, seasons: 0,
  };
  F1Data.drivers.push(freeDriver);
  save.generatedDrivers = save.generatedDrivers || [];
  save.generatedDrivers.push({ ...freeDriver });
  save.contracts = save.contracts || {};
  save.contracts[freeDriver.id] = { years: 0, salary: freeDriver.salary, status: 'agent libre', satisfaction: 50 };
  save.immersion.juniorAcademy = save.immersion.juniorAcademy.filter(x => x.id !== juniorId);
  if (j.feederId) {
    save.feeder.f3.drivers = save.feeder.f3.drivers.filter(d => d.id !== j.feederId);
    save.feeder.f2.drivers = save.feeder.f2.drivers.filter(d => d.id !== j.feederId);
  }
  Immersion.addNews(save, '🚪', 'Académie — Départ', `${name} quitte votre centre et rejoint le mercato.`, 'junior');
  Save.save(save);
  save = Save.load();
  toast(`🚪 ${name} libéré — disponible au mercato`);
  renderTab('academy');
}

function doPromoteReserve(driverId) {
  const current = F1Data.drivers.filter(d => d.teamId === save.playerTeamId && !d.retired && save.contracts?.[d.id]?.status !== 'reserve');
  let replaceId = null;
  if (current.length >= 2) {
    const pick = prompt(`Titulaire à remplacer ?\n${current.map((d,i)=>`${i+1}. ${d.firstName} ${d.name}`).join('\n')}`);
    const idx = parseInt(pick, 10) - 1;
    if (!Number.isFinite(idx) || !current[idx]) return;
    if (!confirm(`Remplacer ${current[idx].firstName} ${current[idx].name} ?`)) return;
    replaceId = current[idx].id;
  }
  const r = Feeder.promoteReserveToF1(save, driverId, replaceId);
  toast(r.ok ? '✅ Promu titulaire !' : r.msg, !r.ok);
  if (r.ok) { save = Save.load(); renderTab('reserve'); }
}

function doReleaseReserve(driverId, name) {
  if (!confirm(`Libérer ${name} de l'équipe réserve ?`)) return;
  Feeder.releaseReserve(save, driverId);
  save = Save.load();
  toast(`${name} libéré`);
  renderTab('reserve');
}

renderPipeline();
renderTab('overview');
</script>
</body>
</html>
